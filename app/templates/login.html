<!DOCTYPE html>
<html>

<head>

    <title>TaskForge Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="icon"
        href="https://cdn-icons-png.flaticon.com/512/906/906334.png"
    >

</head>

<body
    class="
        d-flex
        justify-content-center
        align-items-center
        vh-100
        bg-light
    "
>

    <div
        class="
            card
            p-5
            shadow-lg
        "
        style="
            width: 500px;
            border-radius: 20px;
        "
    >

        <h1
            class="
                text-center
                mb-3
                fw-bold
            "
            style="
                font-size: 4rem;
                color: #0d6efd;
            "
        >
            TaskForge
        </h1>

        <p
            class="
                text-center
                text-muted
                mb-5
            "
            style="
                font-size: 1.1rem;
            "
        >
            Team Collaboration & Task Management Platform
        </p>

        <h3 class="mb-4 text-center">
            Login
        </h3>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                class="form-control mb-3"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                class="form-control mb-4"
                placeholder="Password"
                required
            >

            <button
                class="btn btn-primary w-100 py-2"
                type="submit"
            >
                Login
            </button>

        </form>

    </div>

<script>

document.getElementById(
    "loginForm"
).addEventListener(
    "submit",
    async function(e)
    {
        e.preventDefault()

        const formData =
            new FormData()

        formData.append(
            "username",
            document.getElementById(
                "email"
            ).value
        )

        formData.append(
            "password",
            document.getElementById(
                "password"
            ).value
        )

        const response =
            await fetch(
                "/login",
                {
                    method: "POST",
                    body: formData
                }
            )

        const data =
            await response.json()

        if(response.ok)
        {
            localStorage.setItem(
                "token",
                data.access_token
            )

            localStorage.setItem(
                "role",
                data.role
            )

            alert("Login Successful")

            window.location.href =
                "/dashboard-page"
        }
        else
        {
            alert(
                data.detail || "Login Failed"
            )
        }
    }
)

</script>

</body>
</html>
