<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TaskForge</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    >

    <style>

        body {
            background-color: #f4f6f9;
        }

        .sidebar {

            height: 100vh;

            background-color: #212529;

            color: white;

            padding-top: 20px;
        }

        .sidebar a {

            color: white;

            text-decoration: none;

            display: block;

            padding: 12px 20px;

            margin-bottom: 5px;
        }

        .sidebar a:hover {

            background-color: #343a40;

            border-radius: 8px;
        }

        .content {

            padding: 20px;
        }

        .card {

            border: none;

            border-radius: 15px;

            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 sidebar">

            <h3 class="text-center mb-4">
                TaskForge
            </h3>

            <a href="/dashboard-page">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="/projects-page">
                <i class="bi bi-folder"></i>
                Projects
            </a>

            <a href="/tasks-page">
                <i class="bi bi-list-task"></i>
                Tasks
            </a>

            <a href="/users-page">
                <i class="bi bi-people"></i>
                Users
            </a>
            
            <a
                href="#"
                onclick="logout()"
            >

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>

        <div class="col-md-10 content">

            {% block content %}

            {% endblock %}

            <div
                class="
                    text-center
                    text-muted
                    mt-5
                "
            >

                Built with FastAPI + PostgreSQL by Sangbit Pramanick

            </div>
        </div>

    </div>

</div>



</body>
<script>

function logout()
{
    localStorage.clear()

    window.location.href =
        "/login-page"
}


</script>

  

</html>
