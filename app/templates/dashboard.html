{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
    Dashboard
</h2>

<div class="row">

    <div class="col-md-3">

        <div class="card p-3">

            <h5>Total Tasks</h5>

            <h2 id="totalTasks">0</h2>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card p-3">

            <h5>Completed</h5>

            <h2 id="completedTasks">0</h2>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card p-3">

            <h5>Pending</h5>

            <h2 id="pendingTasks">0</h2>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card p-3">

            <h5>Overdue</h5>

            <h2 id="overdueTasks">0</h2>

        </div>

    </div>
    <div class="card p-4 mt-4">

        <h4 class="mb-3">
            Recent Tasks
        </h4>

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>

                    <th>Task</th>

                    <th>Status</th>

                    <th>Priority</th>

                    <th>Due Date</th>

                </tr>

            </thead>

            <tbody id="recentTasks">

            </tbody>

        </table>

    </div>

</div>

<script>

async function loadDashboard()
{
    const token =
        localStorage.getItem("token")

    const response =
        await fetch("/dashboard",
        {
            headers:
            {
                "Authorization":
                    `Bearer ${token}`
            }
        })

    const data =
        await response.json()

    document.getElementById(
        "totalTasks"
    ).innerText =
        data.total_tasks

    document.getElementById(
        "completedTasks"
    ).innerText =
        data.completed_tasks

    document.getElementById(
        "pendingTasks"
    ).innerText =
        data.pending_tasks

    document.getElementById(
        "overdueTasks"
    ).innerText =
        data.overdue_tasks
}
async function loadRecentTasks()
{
    const token =
        localStorage.getItem("token")

    const role =
        localStorage.getItem("role")

    let endpoint = "/tasks"

    if(role == "member")
    {
        endpoint = "/my-tasks"
    }

    const response =
        await fetch(
            endpoint,
            {
                headers:
                {
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        )

    const tasks =
        await response.json()

    const table =
        document.getElementById(
            "recentTasks"
        )

    table.innerHTML = ""

    tasks.slice(0, 5).forEach(task =>
    {
        let priorityColor = "primary"

        if(task.priority == "High")
        {
            priorityColor = "danger"
        }
        else if(task.priority == "Medium")
        {
            priorityColor = "warning"
        }

        table.innerHTML +=
        `
        <tr>

            <td>${task.title}</td>

            <td>${task.status}</td>

            <td>

                <span class="badge bg-${priorityColor}">
                    ${task.priority}
                </span>

            </td>

            <td>${task.due_date}</td>

        </tr>
        `
    })
}

loadRecentTasks()
loadDashboard()

</script>

{% endblock %}
